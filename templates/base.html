<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the world through an intelligent visual encyclopedia.">

    <title>WordWorld 3D — Explore Everything</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
</head>

<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="WordWorld 3D homepage">
            <span class="brand-icon">W</span>
            <span>WordWorld <strong>3D</strong></span>
        </a>

        <nav class="main-navigation" aria-label="Main navigation">
            <a href="/#explore">Explore</a>
            <a href="/#discover">Discover</a>
            <a href="/#bookmarks">Bookmarks</a>

            <button
                id="theme-toggle"
                class="theme-toggle"
                type="button"
                aria-label="Switch to dark theme"
            >
                <svg class="theme-icon" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5
                             8.5 8.5 0 1 0 20.5 14.5Z"/>
                </svg>
            </button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <p class="eyebrow">KNOWLEDGE WITHOUT LIMITS</p>
            <h1>Explore the world.<br><span>Understand everything.</span></h1>
            <p class="hero-description">
                Discover the people, places, living things, events,
                and ideas that shape our world.
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <a class="brand footer-brand" href="/">
            <span class="brand-icon">W</span>
            <span>WordWorld <strong>3D</strong></span>
        </a>

        <p>Explore knowledge. Discover connections. Understand our world.</p>
        <p class="copyright">&copy; 2026 WordWorld 3D</p>
    </footer>
</body>
</html>
